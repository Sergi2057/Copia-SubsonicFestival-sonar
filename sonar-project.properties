# Configuración de SonarCloud (Trabajo 4 - GPS)
# Revisa que organization y projectKey coinciden con los que muestra SonarCloud
sonar.organization=sergi2057
sonar.projectKey=Sergi2057_Copia-SubsonicFestival-sonar
sonar.projectName=SubsonicFestival - Sergio Almodóvar
sonar.projectVersion=1.0

# Código: frontend (React), gateway, microservicios (Python) e infraestructura
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/dist/**,**/tests/**,**/*.test.js,**/*.test.jsx,docs/**
sonar.tests=.
sonar.test.inclusions=**/tests/**,**/*.test.js,**/*.test.jsx
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
