name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Tests del frontend (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test

  python:
    name: Tests de Python (${{ matrix.servicio }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [ gateway, ms-analitica, ms-escaleta, ms-espacios, ms-tienda, ms-usuarios ]
    defaults:
      run:
        working-directory: ${{ matrix.servicio }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.servicio }}/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
