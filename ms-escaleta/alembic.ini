# Migraciones de escaleta_db. La URL de la base de datos se lee de config/settings.py (DATABASE_URL).
#   alembic upgrade head                              -> aplica las migraciones pendientes
#   alembic revision --autogenerate -m "descripción"  -> genera una nueva (revísala siempre)
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
